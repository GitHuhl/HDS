plugins {
    id("com.android.application")
}

android {
    namespace "com.hds.androidtest"
    compileSdk 34

    defaultConfig {
        applicationId "com.hds.androidtest"
        // AAudio needs API 26+ (AAudioStream_dataCallback etc.); android.media.midi needs 23+,
        // so 26 is the real floor here, not 23.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-backend-test"

        ndk {
            // Pixel 8a is arm64 only -- no point packaging the other ABIs for a device-specific test.
            abiFilters "arm64-v8a"
        }
    }

    // Debug-signed only, on purpose: this is a sideload-only test build (see android/README.md
    // for why -- no Play Console account, no developer verification, just `adb install`), and
    // GrapheneOS's installer doesn't gate on that the way stock Android now does.
    buildTypes {
        debug {
            debuggable true
        }
    }

    // No externalNativeBuild here on purpose: app/src/main/cpp/CMakeLists.txt is kept as the
    // documented, exact recipe for libhds_native.so, but this Gradle project packages a PREBUILT
    // copy of that .so from app/src/main/jniLibs/arm64-v8a/ instead of invoking CMake/NDK itself
    // every build -- same output, one less moving part in Gradle's own dependency graph. That .so
    // is a build OUTPUT, never committed (see .gitignore) -- produce it with either
    // tools/build_android_manual.sh (see android/README.md) or a real externalNativeBuild/CMake
    // run before building this Gradle project, or this APK will have no native library at all.
    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    // Plain Java only (no Kotlin plugin) -- see NativeBridge.java's own header comment for why,
    // and MainActivity.java's for a second, independent reason (a D8 version this sandbox
    // happens to bundle crashes on certain class shapes; building this Gradle project elsewhere,
    // with a properly AGP-matched D8/R8, may not need the -source/-target 8 downgrade
    // tools/build_android_manual.sh applies for that reason specifically).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
