plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android") version "1.9.24"
}

android {
    namespace "com.hds.androidtest"
    compileSdk 34

    defaultConfig {
        applicationId "com.hds.androidtest"
        // AAudio needs API 26+ (AAudioStream_dataCallback etc.); android.media.midi needs 23+,
        // so 26 is the real floor here, not 23.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-backend-test"

        ndk {
            // Pixel 8a is arm64 only -- no point building the other ABIs for a device-specific test.
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    // Debug-signed only, on purpose: this is a sideload-only test build (see android/README.md
    // for why -- no Play Console account, no developer verification, just `adb install`), and
    // GrapheneOS's installer doesn't gate on that the way stock Android now does.
    buildTypes {
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}
